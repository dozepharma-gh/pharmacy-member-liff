<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิกร้านยา</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
    <!-- Header -->
    <div class="bg-emerald-600 p-6 text-center text-white relative">
      <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-md text-emerald-600 text-3xl">
        <i class="fa-solid fa-prescription-bottle-medical"></i>
      </div>
      <h1 class="text-2xl font-bold">สมัครสมาชิกร้านยา</h1>
      <p class="text-emerald-100 text-sm mt-1">รับสิทธิประโยชน์ ส่วนลดสะสมแต้ม และคูปองวันเกิด</p>
    </div>

    <!-- User Profile Preview (Auto-filled by LIFF) -->
    <div class="bg-emerald-100/60 px-6 py-3 flex items-center gap-3 border-b border-emerald-100">
      <img id="userPicture" src="https://via.placeholder.com/40" alt="Profile" class="w-10 h-10 rounded-full border border-emerald-300">
      <div>
        <p class="text-xs text-emerald-800">เชื่อมต่อกับ LINE:</p>
        <p id="userName" class="text-sm font-semibold text-emerald-950">กำลังโหลดข้อมูล LINE...</p>
      </div>
    </div>

    <!-- Form -->
    <form id="registerForm" class="p-6 space-y-4">
      <!-- Hidden Input for LINE User ID -->
      <input type="hidden" id="lineUserId" name="lineUserId">

      <!-- Phone -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="fa-solid fa-phone"></i>
          </div>
          <input type="tel" id="phone" name="phone" required placeholder="08X-XXX-XXXX" pattern="[0-9]{9,10}"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-800">
        </div>
      </div>

      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล <span class="text-red-500">*</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="fa-solid fa-user"></i>
          </div>
          <input type="text" id="fullName" name="fullName" required placeholder="นายสมชาย ใจดี"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-800">
        </div>
      </div>

      <!-- Nickname -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อเล่น <span class="text-xs text-gray-400">(ไม่บังคับ)</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="fa-solid fa-smile"></i>
          </div>
          <input type="text" id="nickname" name="nickname" placeholder="ชาย"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-800">
        </div>
      </div>

      <!-- Date of Birth -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">วัน/เดือน/ปีเกิด <span class="text-xs text-gray-400">(ไม่บังคับ)</span></label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <i class="fa-solid fa-cake-candles"></i>
          </div>
          <input type="date" id="dob" name="dob"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-gray-800">
        </div>
        <p class="text-xs text-emerald-600 mt-1"><i class="fa-solid fa-gift mr-1"></i>ระบุเพื่อรับคูปองส่วนลดพิเศษในเดือนเกิด</p>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2 mt-6">
        <span>ยืนยันการสมัครสมาชิก</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
  </div>

  <script>
    // ** จุดที่ 1: นำ LIFF ID จาก LINE Developers มาวางตรงนี้ **
    const MY_LIFF_ID = "YOUR_LIFF_ID"; 

    // ** จุดที่ 2: นำ Web App URL จาก Google Apps Script มาวางตรงนี้ **
    const GAS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 

    async function initializeLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById('lineUserId').value = profile.userId;
          document.getElementById('userName').textContent = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById('userPicture').src = profile.pictureUrl;
          }
        } else {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF Initialization failed", err);
        document.getElementById('userName').textContent = "เปิดทดสอบในเบราว์เซอร์";
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';

      const formData = {
        lineUserId: document.getElementById('lineUserId').value,
        phone: document.getElementById('phone').value,
        fullName: document.getElementById('fullName').value,
        nickname: document.getElementById('nickname').value,
        dob: document.getElementById('dob').value
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(formData)
        });
        const result = await response.json();

        if (result.result === 'success') {
          alert('🎉 สมัครสมาชิกเรียบร้อยแล้วค่ะ!');
          if (liff.isInClient()) {
            liff.closeWindow(); // ปิดหน้าต่าง LIFF บน LINE อัตโนมัติ
          }
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.message);
        }
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>ยืนยันการสมัครสมาชิก</span><i class="fa-solid fa-arrow-right"></i>';
      }
    });

    window.onload = initializeLiff;
  </script>
</body>
</html>
